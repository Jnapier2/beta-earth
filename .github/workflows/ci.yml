name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile source
        run: python -m compileall -q src tests BetaEarthSovereignty.py
      - name: Run public verification suite
        run: python -m unittest discover -s tests -t . -v
      - name: Run release dry check
        run: python BetaEarthSovereignty.py --dry-run
      - name: Run isolated end-to-end self-test
        run: python BetaEarthSovereignty.py --self-test
