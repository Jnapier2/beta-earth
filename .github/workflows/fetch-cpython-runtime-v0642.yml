name: Fetch pinned CPython runtime for MUDD v0.64.2

on:
  push:
    branches:
      - runtime-fetch-v0642-20260821

permissions:
  contents: read

jobs:
  fetch-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Download official CPython 3.13.15 x64 embeddable package
        shell: bash
        run: |
          set -euo pipefail
          url='https://www.python.org/ftp/python/3.13.15/python-3.13.15-embed-amd64.zip'
          file='python-3.13.15-embed-amd64.zip'
          expected_size='11009825'
          expected_sha='d1f04d990aee1253d8569e8e5104e30fa9f5fa830899f14843448872d936a2cf'
          curl --fail --location --retry 4 --retry-all-errors --proto '=https' --tlsv1.2 --output "$file" "$url"
          actual_size="$(stat -c '%s' "$file")"
          actual_sha="$(sha256sum "$file" | awk '{print $1}')"
          test "$actual_size" = "$expected_size"
          test "$actual_sha" = "$expected_sha"
          printf '%s  %s\n' "$actual_sha" "$file" > "$file.sha256.txt"
      - name: Upload verified runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: cpython-3.13.15-embed-amd64-verified
          path: |
            python-3.13.15-embed-amd64.zip
            python-3.13.15-embed-amd64.zip.sha256.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
